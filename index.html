<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            margin-top: 0;
            color: #666;
        }

        .card {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            border: none;
            background: #1769e0;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1057bd;
        }

        .secondary {
            background: #6c757d;
        }

        .danger {
            background: #dc3545;
        }

        .small {
            width: auto;
            padding: 7px 10px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 8px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f8f9fa;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        #message {
            min-height: 20px;
            margin-top: 10px;
            color: #1769e0;
        }

        .docs {
            float: right;
            color: #1769e0;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 9px 5px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Inventory</h1>
        <p class="subtitle">FastAPI Project</p>

        <div class="card">
            <h2 id="form-title">Add Item</h2>
            <form id="item-form">
                <input id="item-id" type="hidden" />
                <div class="form-grid">
                    <input id="name" type="text" placeholder="Item name" required />
                    <input id="price" type="number" step="0.01" placeholder="Price" required />
                    <input id="quantity" type="number" placeholder="Quantity" required />
                </div>
                <div class="form-actions">
                    <button type="submit">Save Item</button>
                    <button id="cancel-button" class="secondary" type="button" hidden>
                        Cancel Edit
                    </button>
                </div>
            </form>
            <div id="message"></div>
        </div>

        <div class="card">
            <div class="search-row">
                <input id="search" type="text" placeholder="Search by name or category" />
                <button id="search-button" class="small" type="button">Search</button>
                <button id="clear-button" class="secondary small" type="button">
                    Clear
                </button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="item-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        const form = document.getElementById("item-form");
        const itemList = document.getElementById("item-list");
        const message = document.getElementById("message");
        const itemId = document.getElementById("item-id");
        const nameInput = document.getElementById("name");
        const priceInput = document.getElementById("price");
        const quantityInput = document.getElementById("quantity");
        const searchInput = document.getElementById("search");
        const cancelButton = document.getElementById("cancel-button");

        let items = [];

        async function loadItems()
        {
            const search = encodeURIComponent(searchInput.value);
            const response = await fetch(`/items?search=${search}`);
            items = await response.json();
            showItems();
        }

        function showItems()
        {
            itemList.innerHTML = "";

            for (const item of items)
            {
                const row = document.createElement("tr");
                row.innerHTML = `
          <td>${escapeHtml(item.name)}</td>
          <td>${Number(item.price).toFixed(2)}</td>
          <td>${item.quantity}</td>
          <td class="actions">
            <button class="small" onclick="editItem(${item.id})">Edit</button>
            <button class="danger small" onclick="deleteItem(${item.id})">Delete</button>
          </td>
        `;
                itemList.appendChild(row);
            }
        }

        function escapeHtml(value)
        {
            const div = document.createElement("div");
            div.textContent = value;
            return div.innerHTML;
        }

        form.addEventListener("submit", async (event) =>
        {
            event.preventDefault();

            const data = {
                name: nameInput.value,
                price: Number(priceInput.value),
                quantity: Number(quantityInput.value),
            };

            const editing = itemId.value !== "";
            const url = editing ? `/items/${itemId.value}` : "/items";
            const method = editing ? "PUT" : "POST";

            const response = await fetch(url, {
                method: method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            });

            if (response.ok)
            {
                message.textContent = editing ? "Item updated" : "Item added";
                resetForm();
                loadItems();
            } else
            {
                message.textContent = "Could not save item";
            }
        });

        function editItem(id)
        {
            const item = items.find((currentItem) => currentItem.id === id);
            itemId.value = item.id;
            nameInput.value = item.name;
            priceInput.value = item.price;
            quantityInput.value = item.quantity;
            document.getElementById("form-title").textContent = "Edit Item";
            cancelButton.hidden = false;
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        async function deleteItem(id)
        {
            if (!confirm("Delete this item?")) return;

            const response = await fetch(`/items/${id}`, { method: "DELETE" });
            if (response.ok)
            {
                message.textContent = "Item deleted";
                loadItems();
            }
        }

        function resetForm()
        {
            form.reset();
            itemId.value = "";
            document.getElementById("form-title").textContent = "Add Item";
            cancelButton.hidden = true;
        }

        cancelButton.addEventListener("click", resetForm);
        document
            .getElementById("search-button")
            .addEventListener("click", loadItems);
        document.getElementById("clear-button").addEventListener("click", () =>
        {
            searchInput.value = "";
            loadItems();
        });
        searchInput.addEventListener("keydown", (event) =>
        {
            if (event.key === "Enter") loadItems();
        });

        loadItems();
    </script>
</body>

</html>
